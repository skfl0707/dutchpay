<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101B3B">
  <title>더치페이 정산기</title>
  <meta name="description" content="모임 비용을 가장 적은 송금 횟수로 정산해 주는 앱">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#2F5BFF"/><path d="M8 12h14l-3.5-3.5M24 20H10l3.5 3.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>더치페이 정산기</h1>
    </div>
    <button id="reset" class="link" type="button">처음부터</button>
  </header>

  <main class="wrap">
    <section class="card" aria-labelledby="h1">
      <h2 id="h1"><span class="step">1</span>누구와 함께했나요?</h2>
      <form id="personForm" class="row">
        <input id="personName" type="text" placeholder="이름을 입력하세요" maxlength="10" autocomplete="off" enterkeyhint="done" aria-label="참가자 이름">
        <button type="submit" class="btn">추가</button>
      </form>
      <ul id="people" class="chips"></ul>
      <p id="peopleHint" class="hint">함께한 사람을 2명 이상 추가하면 다음 단계가 열려요.</p>
    </section>

    <section class="card" id="expenseCard" aria-labelledby="h2">
      <h2 id="h2"><span class="step">2</span>누가 얼마를 냈나요?</h2>
      <form id="expenseForm">
        <label>내용 <input id="expTitle" type="text" placeholder="예: 저녁 식사" maxlength="20" autocomplete="off"></label>
        <label>결제한 사람 <select id="expPayer"></select></label>
        <label>금액 <div class="money"><input id="expAmount" type="text" inputmode="numeric" placeholder="0" autocomplete="off"><span>원</span></div></label>
        <fieldset>
          <legend>함께 나눌 사람</legend>
          <div id="expShares" class="checks"></div>
        </fieldset>
        <button type="submit" class="btn big">지출 추가</button>
      </form>
      <ul id="expenses" class="list"></ul>
      <p id="expEmpty" class="empty" hidden>아직 입력한 지출이 없어요. 위에서 첫 지출을 추가해 보세요.</p>
    </section>

    <section class="result" id="resultCard" aria-labelledby="h3" aria-live="polite">
      <h2 id="h3"><span class="step">3</span>정산 결과</h2>
      <div id="resultBody">
        <p id="total" class="sum"></p>
        <ul id="transfers" class="tlist"></ul>
      </div>
      <p id="resultEmpty" class="rempty">지출을 추가하면 누가 누구에게 얼마를 보내면 되는지 여기에 나와요.</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="settle.js"></script>
  <script src="app.js"></script>
</body>
</html>
